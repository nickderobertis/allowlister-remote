# This repository's warm-pool maintenance, declared for onevcs. onevcs pool
# maintenance reads this file from the publication checkout on its base branch
# (never a session's branch) and runs `command` in each idle slot's worktree,
# never in a slot a session holds. The `pool-maintenance` recipe runs
# cargo-prune-superseded over every cargo target dir this repository builds
# into: it removes each unit's superseded builds older than 2 days and keeps
# each unit's newest build plus every build modified within those 2 days, so
# rebuilds stay warm. Without this file onevcs maintains none of this
# repository's slots.
schema_version = 1

[pool.maintain]
command = ["just", "pool-maintenance"]
timeout = "30m"
