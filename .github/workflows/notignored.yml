# Sticky PR comment listing the lint/type-check suppressions a pull request adds
# (rule, reason, link), so a reviewer sees every bypass without reading the whole
# diff. A review artifact, not a gate: it skips fork PRs (their read-only token
# cannot comment), so it must never become a required check — `check` is the gate.

name: notignored

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: notignored-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suppressions:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan diffs against the base branch, which a shallow checkout omits.
          fetch-depth: 0
      # Floating major: follows each published 0.x release.
      - uses: nickderobertis/notignored@v0
