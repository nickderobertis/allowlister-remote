name: check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Run the manual Mac diagnostic (outside automatic lifecycle)
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: check-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux reports protected contexts; ordinary PRs buy one Mac lane.
  setup:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
      tier: ${{ steps.pick.outputs.tier }}
      macosRequired: ${{ steps.policy.outputs.macosRequired }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - id: policy
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/macos-policy.mjs classify --event "$GITHUB_EVENT_PATH" --base "$PR_BASE" --head "$PR_HEAD"
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          MACOS_REQUIRED: ${{ steps.policy.outputs.macosRequired }}
          DIAGNOSTIC: ${{ inputs.macos }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$MACOS_REQUIRED" == "false" ]]; then
              echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            else
              echo 'os=["ubuntu-latest","macos-14"]' >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$DIAGNOSTIC" == "true" ]]; then
            echo 'os=["ubuntu-latest","macos-14","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == release-please--branches--main* ]]; then
            echo 'tier=all' >> "$GITHUB_OUTPUT"
          else
            echo 'tier=affected' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.setup.outputs.os) }}
    # The affected lanes finish well inside ~20 min and the release PR's full
    # sweep (every project, Rust coverage included) inside ~35; cap the job so a
    # wedged test or runner fails fast and is retryable instead of sitting for the
    # default 6h.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: extractions/setup-just@v3
      - name: Install allowlister
        shell: bash
        env:
          # Authenticate the install script's "resolve latest" GitHub API call so
          # shared runner IPs (notably macOS) don't hit the unauthenticated limit.
          GITHUB_TOKEN: ${{ github.token }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/nickderobertis/allowlister/main/scripts/install.sh \
            | bash -s -- --bin-dir "$HOME/.allowlister/bin"
          if [[ "$RUNNER_OS_NAME" == "Windows" ]]; then
            cygpath -w "$HOME/.allowlister/bin" >> "$GITHUB_PATH"
          else
            echo "$HOME/.allowlister/bin" >> "$GITHUB_PATH"
          fi
      # The toolchain (stable + rustfmt, clippy, llvm-tools) comes from
      # rust-toolchain.toml, the single source of truth.
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install coverage and supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny,cargo-machete
      - name: Install pinned actionlint
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          install_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$install_dir"
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            | bash -s -- 1.7.12 "$install_dir"
          if [[ "$RUNNER_OS_NAME" == "Windows" ]]; then
            cygpath -w "$install_dir" >> "$GITHUB_PATH"
          else
            echo "$install_dir" >> "$GITHUB_PATH"
          fi
      - run: just bootstrap
      - name: Install Playwright browser (Linux)
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright browser (macOS/Windows)
        if: runner.os != 'Linux'
        run: npx playwright install chromium
      - name: Resolve affected base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # PRs compare against the PR base; pushes against the prior commit. Fall
          # back to the merge-base with origin/main when "before" is unset/zeroed/
          # unreachable (branch creation or force-push), so nx affected never fails
          # to resolve its base.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
            zero="0000000000000000000000000000000000000000"
            if [[ -z "$base" || "$base" == "$zero" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags origin main >/dev/null 2>&1 || true
              base="$(git merge-base origin/main HEAD)"
            fi
          fi
          echo "NX_BASE=$base" >> "$GITHUB_ENV"
          echo "NX_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Run the gate (affected tier, or the full sweep on the release PR)
        shell: bash
        env:
          TIER: ${{ needs.setup.outputs.tier }}
        run: just check "$TIER"

  # Aggregate context so branch protection can require a single "check" status
  # regardless of the matrix legs — including the release PR's full sweep.
  check-required:
    name: check
    runs-on: ubuntu-latest
    needs: [setup, check]
    if: always()
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Verify all required matrix legs succeeded
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          MACOS_REQUIRED: ${{ needs.setup.outputs.macosRequired }}
          OS_MATRIX: ${{ needs.setup.outputs.os }}
          EVENT_NAME: ${{ github.event_name }}
          DIAGNOSTIC: ${{ inputs.macos }}
        run: node .github/check-results.mjs

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cargo build --release -p allowlister-remote-plugin -p allowlister-remote-daemon
      - run: npx nx run web:build
      - name: Stage native binaries into platform package
        run: |
          mkdir -p packages/allowlister-remote-plugin-linux-x64/bin
          cp target/release/allowlister-remote-plugin packages/allowlister-remote-plugin-linux-x64/bin/allowlister-remote-plugin
          cp target/release/allowlister-remote-daemon packages/allowlister-remote-plugin-linux-x64/bin/allowlister-remote-daemon
          chmod +x packages/allowlister-remote-plugin-linux-x64/bin/allowlister-remote-plugin packages/allowlister-remote-plugin-linux-x64/bin/allowlister-remote-daemon
      - name: Smoke-test npm install path
        run: npm run release:smoke-npm
