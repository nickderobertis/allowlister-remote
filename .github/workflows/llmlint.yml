name: llmlint

# Fork pull requests are gated by the repository's require-approval setting, not
# by a skip here: the job always needs its credential (see AGENTS.md).

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: llmlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llmlint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # codex is the primary harness in oneharness.toml's fallback chain
      # (codex, claude-code); OPENAI_API_KEY is its credential.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Require the llmlint harness credential
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::llmlint needs the codex harness credential: add the repository secret OPENAI_API_KEY (Settings → Secrets and variables → Actions; declared in gh-secrets.json, synced with 'gh-secrets sync'). The model-backed diff lint never passes without it." >&2
            exit 1
          fi
      # The PR head (not the synthetic merge ref) with full history, so the
      # merge base with main resolves.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Fetch main (diff base)
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install just
        run: uv tool install rust-just
      - name: Install oneharness + llmlint
        run: |
          just setup-llmlint
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # setup-llmlint.sh installs llmlint + oneharness only, not a harness: install
      # the one oneharness.toml's fallback chain names first and log it in.
      - name: Install and authenticate the codex harness
        run: |
          npm install --global @openai/codex
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status
      # Deterministic, model-free gate first: config structure, ignore directives,
      # fragment version bumps — scoped to the branch's changes vs main.
      - name: Validate llmlint config (no model)
        run: just lint-llm-validate --diff-base origin/main
      - name: Lint changed lines
        run: just lint-llm-diff origin/main
