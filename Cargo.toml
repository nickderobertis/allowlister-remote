[workspace]
members = [
  "crates/allowlister-remote-broker",
  "crates/allowlister-remote-daemon",
  "crates/allowlister-remote-e2e",
  "crates/allowlister-remote-plugin",
  "crates/allowlister-remote-protocol",
]
resolver = "2"

# Metadata every crate inherits. `version` is the 0.0.0 placeholder: the shipped
# binaries' version is the release tag, stamped at build time
# (ALLOWLISTER_REMOTE_PLUGIN_VERSION), so Cargo.toml/Cargo.lock never drift. No
# crate is published to crates.io.
[workspace.package]
version = "0.0.0"
edition = "2021"
repository = "https://github.com/nickderobertis/allowlister-remote"
publish = false

# Every crate inherits these (`[lints] workspace = true`): a rustc warning is an
# error in every cargo invocation the gate makes (check, build, llvm-cov tests),
# not only under clippy's `-D warnings`. Dependencies are capped by cargo.
[workspace.lints.rust]
warnings = "deny"

# Dependencies more than one crate declares, resolved once here.
[workspace.dependencies]
serde_json = "1.0.150"

# Small, fast-starting release binary: thin LTO + a single codegen unit for
# cross-function inlining, stripped symbols, and abort-on-panic to drop the
# unwinding tables. Profiles live at the workspace root because cargo only
# honors `[profile.*]` in the root manifest.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Profiling builds: the shipped release artifact exactly, but with symbols kept
# so `samply` (see `scripts/profile.sh`) can attribute time to functions. This
# never affects the published binary — `scripts/profile.sh` builds `--profile
# profiling` into `target/profiling/` while `[profile.release]` stays stripped.
[profile.profiling]
inherits = "release"
debug = true
strip = false
