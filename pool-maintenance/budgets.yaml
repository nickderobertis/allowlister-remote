schema_version: 1
budgets:
  - id: allowlister-remote-pool-maintenance-seconds
    description: >-
      Wall-clock seconds one steady-state pass of this repository's declared
      pool maintenance (`just pool-maintenance`) takes after one ordinary run's
      worth of new superseded builds, as cargo-prune-superseded reports it.
      Protects how long a regular post-run pass holds one of this repository's
      warm-pool slots out of service.
    labels: [host]
    measure: reported
    command: ["./measure.sh"]
    unit: seconds
    direction: max
    threshold: 20
    timeout_seconds: 3600
